<!-- Favicon: el navegador lo pinta a 16 px. A ese tamaño «AMM» no se lee
     —se comprobó—, así que acá va la inicial sola dentro del marco. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="8" fill="#4a2c1d"/>
  <rect x="13" y="13" width="74" height="74" fill="none" stroke="#f6efe6" stroke-width="9"/>
  <text x="50" y="54" fill="#f6efe6" font-family="Arial Black, Arial, sans-serif"
        font-size="54" font-weight="900" text-anchor="middle" dominant-baseline="central"
        textLength="40" lengthAdjust="spacingAndGlyphs">A</text>
</svg>
